{% extends "base.html" %}

{% block title %}Login | mainty{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6 col-xl-4">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <h1 class="h4 mb-4">Anmelden</h1>
          <form method="post" novalidate>
            {% csrf_token %}
            {% if form.non_field_errors %}
              <div class="alert alert-danger">
                {{ form.non_field_errors }}
              </div>
            {% endif %}
            {% if next %}
              <input type="hidden" name="next" value="{{ next }}" />
            {% endif %}
            <div class="mb-3">
              <label class="form-label" for="{{ form.username.id_for_label }}">Benutzername</label>
              {{ form.username }}
            </div>
            <div class="mb-4">
              <label class="form-label" for="{{ form.password.id_for_label }}">Passwort</label>
              {{ form.password }}
            </div>
            <button class="btn btn-primary w-100" type="submit">Login</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
